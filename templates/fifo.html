<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FlowPrint FIFO | Smart Print Queue System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e9eff7 0%, #dce5f0 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .navbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 1rem 0;
        }

        .nav-link {
            text-decoration: none;
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid #cddfe7;
            color: #1e3a5f;
            background: rgba(255,255,255,0.75);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .nav-link:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.95);
        }

        .nav-link.active {
            background: #1f4e6e;
            color: white;
            border-color: #1f4e6e;
        }

        /* main container with soft shadow and rounded edges */
        .app-container {
            max-width: 1500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            padding: 1.8rem 2rem 2.2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: all 0.2s;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1a2a3f, #1e3a5f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.25rem;
        }

        h2::before {
            content: "🖨️";
            font-size: 2rem;
            background: none;
            -webkit-background-clip: unset;
            color: #2c4c6e;
        }

        /* message banner */
        .msg-toast {
            background: #1e2f3c;
            color: #f0f9ff;
            padding: 0.85rem 1.5rem;
            border-radius: 60px;
            margin: 0.75rem 0 1.5rem 0;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-block;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            animation: fadeSlideIn 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(-12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* input row */
        .input-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 1.8rem 0 2rem 0;
            background: rgba(255,255,255,0.7);
            padding: 1.2rem 1.5rem;
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02), inset 0 1px 0 white;
        }

        .input-panel input, .input-panel button {
            border: none;
            outline: none;
            font-size: 0.95rem;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            transition: all 0.2s;
        }

        .input-panel input {
            flex: 1;
            min-width: 140px;
            background: white;
            border: 1px solid #cddfe7;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .input-panel input:focus {
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
            transform: scale(1.01);
        }

        .input-panel button {
            background: #1f4e6e;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .input-panel button:hover {
            background: #0f3b56;
            transform: translateY(-2px);
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.25);
        }

        .input-panel button:active {
            transform: translateY(1px);
        }

        /* grid layout with smooth spacing */
        .grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .col {
            flex: 1;
            min-width: 320px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(2px);
            border-radius: 1.8rem;
            padding: 0.2rem 0 1rem 0;
            box-shadow: 0 12px 24px -12px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .col h3 {
            margin: 1rem 0 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 1.45rem;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .col:first-child h3::before {
            content: "⏳";
            font-size: 1.5rem;
        }
        .col:last-child h3::before {
            content: "✅";
            font-size: 1.5rem;
        }

        /* modern table styling */
        .table-wrapper {
            overflow-x: auto;
            margin: 0 0.8rem 1rem 0.8rem;
            border-radius: 1.2rem;
            background: rgba(255,255,255,0.5);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            padding: 14px 10px;
            background: #eef3fc;
            color: #1e3a5f;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #cbdde9;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e2edf5;
            background-color: white;
            transition: background 0.2s;
            color: #1f2f3e;
        }

        tr:hover td {
            background-color: #f6fbfe;
        }

        /* status badges */
        td:last-child, th:last-child {
            text-align: left;
        }

        /* special styling for status text */
        td:last-child {
            font-weight: 500;
        }

        /* queue row animation when new job arrives */
        @keyframes gentlePop {
            0% {
                background-color: #ffe6c7;
                transform: scale(0.98);
            }
            60% {
                background-color: #fff1e0;
            }
            100% {
                background-color: white;
            }
        }

        .queue-animate {
            animation: gentlePop 0.45s ease-out;
        }

        /* completed row new item animation */
        @keyframes completeGlow {
            0% {
                background-color: #d0f0d0;
                box-shadow: inset 0 0 0 2px #6fbf6f;
            }
            100% {
                background-color: white;
            }
        }

        .complete-animate {
            animation: completeGlow 0.55s ease-out;
        }

        /* Responsive */
        @media (max-width: 780px) {
            body {
                padding: 1rem;
            }
            .app-container {
                padding: 1rem;
            }
            .input-panel {
                flex-direction: column;
            }
            .input-panel input, .input-panel button {
                width: 100%;
            }
            th, td {
                font-size: 0.75rem;
                padding: 8px 6px;
            }
        }

        /* custom scroll */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9bb7cf;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <nav class="navbar">
        <a class="nav-link active" href="/fifo">FIFO</a>
        <a class="nav-link" href="/priority">Priority</a>
        <a class="nav-link" href="/sjf">SJF</a>
        <a class="nav-link" href="/ljf">LJF</a>
        <a class="nav-link" href="/roundrobin">Round Robin</a>
    </nav>
    <h2>FIFO Print System</h2>
    <div id="msg" class="msg-toast" style="display: none;"></div>

    <div style="margin: 0.25rem 0 1.1rem 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px;">
            <div style="font-weight:600; color:#1e3a5f;">Overall Progress</div>
            <div id="overallText" style="font-weight:600; color:#1e3a5f;">0%</div>
        </div>
        <div style="height: 10px; background:#e2edf5; border-radius: 999px; overflow:hidden;">
            <div id="overallBar" style="height: 100%; width: 0%; background:#1f4e6e;"></div>
        </div>
    </div>

    <div class="input-panel">
        <input type="text" id="emp" placeholder="Employee name 👤" autocomplete="off">
        <input type="text" id="doc" placeholder="Document name 📄" autocomplete="off">
        <input type="number" id="pages" placeholder="Pages 📑" value="1" min="1">
        <button id="addBtn">➕ Add Print Job</button>
    </div>

    <div class="grid">
        <div class="col">
            <h3>Active Queue</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Employee</th><th>File</th><th>Pages</th><th>Time</th><th>Status</th><th>Progress</th></tr>
                    </thead>
                    <tbody id="queueBody"></tbody>
                </table>
            </div>
        </div>

        <div class="col">
            <h3>Completed Jobs</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Employee</th><th>File</th><th>Pages</th><th>Time</th><th>Status</th><th>Progress</th></tr>
                    </thead>
                    <tbody id="completedBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // DOM elements
    const empInput = document.getElementById("emp");
    const docInput = document.getElementById("doc");
    const pagesInput = document.getElementById("pages");
    const msgDiv = document.getElementById("msg");
    const queueBody = document.getElementById("queueBody");
    const completedBody = document.getElementById("completedBody");
    const addButton = document.getElementById("addBtn");
    const overallText = document.getElementById("overallText");
    const overallBar = document.getElementById("overallBar");

    let initialized = false;
    let seenCompletedIds = new Set();     // store completed job ids for toast detection
    let lastQueueLength = 0;
    let lastCompletedCount = 0;

    // Helper: show animated message with auto-hide
    function showMessage(text, isError = false) {
        msgDiv.textContent = text;
        msgDiv.style.display = "inline-block";
        msgDiv.style.backgroundColor = isError ? "#aa2e4e" : "#1e4a6e";
        msgDiv.style.color = "white";
        msgDiv.classList.remove("fadeSlideIn");
        void msgDiv.offsetWidth; // re-trigger
        msgDiv.classList.add("fadeSlideIn");
        setTimeout(() => {
            if (msgDiv.textContent === text) {
                msgDiv.style.opacity = "0";
                setTimeout(() => {
                    if (msgDiv.textContent === text) {
                        msgDiv.style.display = "none";
                        msgDiv.style.opacity = "1";
                    }
                }, 200);
            }
        }, 3200);
    }

    // format unix timestamp to readable local string
    function formatTime(timestamp) {
        if (!timestamp) return "—";
        const date = new Date(timestamp * 1000);
        return date.toLocaleString([], { hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: true });
    }

    function statusLabel(status) {
        if (status === "Queued") return "⏳ Queued";
        if (status === "Printing") return "🖨️ Printing";
        if (status === "Completed") return "✅ Completed";
        return status || "—";
    }

    function progressCell(percent) {
        const p = Math.max(0, Math.min(100, parseInt(percent || 0, 10)));
        return `
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="flex:1; height:8px; background:#e2edf5; border-radius:999px; overflow:hidden;">
                    <div style="height:100%; width:${p}%; background:#2c7da0;"></div>
                </div>
                <div style="min-width:38px; font-variant-numeric: tabular-nums;">${p}%</div>
            </div>
        `;
    }

    // generate row html
    function buildRowHtml(job) {
        return `
            <tr data-job-id="${job.job_id}" data-status="${job.status}">
                <td style="font-weight:500;">${job.job_id}</td>
                <td>${escapeHtml(job.employee) || "—"}</td>
                <td>${escapeHtml(job.document) || "—"}</td>
                <td>${job.pages}</td>
                <td>${formatTime(job.timestamp)}</td>
                <td>${statusLabel(job.status)}</td>
                <td>${progressCell(job.progress_percent)}</td>
            </tr>
        `;
    }

    // simple XSS protection
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // add animation to newly added queue rows (based on comparing old vs new)
    function animateNewRows(oldQueueIds, newQueueRows, container, type = 'queue') {
        // newQueueRows is array of job objects after update
        if (!container) return;
        const existingRows = container.querySelectorAll('tr');
        // compare ids that are newly added: they exist in new but not in old set
        if (type === 'queue') {
            const newIdsSet = new Set(newQueueRows.map(j => j.job_id));
            const addedIds = [...newIdsSet].filter(id => !oldQueueIds.has(id));
            if (addedIds.length > 0) {
                // find rows that match those ids and add animation
                for (let row of existingRows) {
                    const rowId = parseInt(row.getAttribute('data-job-id'));
                    if (addedIds.includes(rowId)) {
                        row.classList.add('queue-animate');
                        row.addEventListener('animationend', () => row.classList.remove('queue-animate'), { once: true });
                    }
                }
            }
        }
    }

    function animateCompletedRows(oldCompletedSet, newCompletedJobs, container) {
        if (!container) return;
        const newIds = new Set(newCompletedJobs.map(j => j.job_id));
        const completedAdded = [...newIds].filter(id => !oldCompletedSet.has(id));
        if (completedAdded.length > 0) {
            const rows = container.querySelectorAll('tr');
            for (let row of rows) {
                const rowId = parseInt(row.getAttribute('data-job-id'));
                if (completedAdded.includes(rowId)) {
                    row.classList.add('complete-animate');
                    row.addEventListener('animationend', () => row.classList.remove('complete-animate'), { once: true });
                }
            }
        }
    }

    // core fetch and render with diff-based animations & toast for newly completed jobs
    function loadJobs() {
        fetch("/fifo-jobs")
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                const queueJobs = data.queue || [];
                const completedJobs = data.completed || [];

                const overall = data.overall || { percent: 0 };
                const pct = Math.max(0, Math.min(100, parseInt(overall.percent || 0, 10)));
                overallText.textContent = `${pct}%`;
                overallBar.style.width = `${pct}%`;

                // Capture current queue IDs before rerender (for animation)
                const oldQueueIdsSet = new Set();
                if (queueBody.children.length > 0) {
                    const currentRows = queueBody.querySelectorAll('tr');
                    currentRows.forEach(row => {
                        const idAttr = row.getAttribute('data-job-id');
                        if (idAttr) oldQueueIdsSet.add(parseInt(idAttr));
                    });
                }

                const oldCompletedIdsSet = new Set(seenCompletedIds);

                // re-render both tables with fresh data
                queueBody.innerHTML = queueJobs.map(job => buildRowHtml(job)).join("");
                completedBody.innerHTML = completedJobs.map(job => buildRowHtml(job)).join("");

                // Animate newly added queue rows
                const newQueueIds = queueJobs.map(j => j.job_id);
                animateNewRows(oldQueueIdsSet, queueJobs, queueBody, 'queue');

                // Animate newly completed rows
                animateCompletedRows(oldCompletedIdsSet, completedJobs, completedBody);

                // --- TOAST for jobs that just completed (appear in completed & were not in previous seenCompletedIds)
                if (initialized) {
                    // find which job IDs are newly completed
                    const currentCompletedIds = new Set(completedJobs.map(j => j.job_id));
                    const freshlyCompleted = [...currentCompletedIds].filter(id => !oldCompletedIdsSet.has(id));
                    if (freshlyCompleted.length > 0) {
                        // get job details for better message
                        freshlyCompleted.forEach(jobId => {
                            const jobDetail = completedJobs.find(j => j.job_id === jobId);
                            if (jobDetail) {
                                showMessage(`✨ Job #${jobDetail.job_id} (“${escapeHtml(jobDetail.document)}”) completed successfully.`, false);
                            } else {
                                showMessage(`🎉 Print job #${jobId} completed!`, false);
                            }
                        });
                    }
                }

                // update seen completed ids set (persist)
                seenCompletedIds.clear();
                completedJobs.forEach(j => seenCompletedIds.add(j.job_id));

                // extra toast on first load: don't notify on initial old jobs
                if (!initialized) {
                    initialized = true;
                    if (completedJobs.length > 0) {
                        // just store without showing toasts
                    }
                }

                // optional: if queue length becomes 0 from positive, we can notify but it's fine, but not needed.
                lastQueueLength = queueJobs.length;
                lastCompletedCount = completedJobs.length;
            })
            .catch(err => {
                console.warn("Fetch error:", err);
                // If backend not reachable (simulate demo mode) we show a soft warning
                if (!initialized) {
                    msgDiv.textContent = "⚠️ Waiting for backend... ensure server is running on /fifo-jobs";
                    msgDiv.style.display = "block";
                    msgDiv.style.backgroundColor = "#b9534e";
                }
            });
    }

    // add job POST request with optimistic feedback
    function addJob() {
        const employee = empInput.value.trim();
        const documentName = docInput.value.trim();
        let pages = parseInt(pagesInput.value, 10);

        if (!employee) {
            showMessage("❌ Please enter employee name", true);
            return;
        }
        if (!documentName) {
            showMessage("❌ Please enter document name", true);
            return;
        }
        if (isNaN(pages) || pages < 1) {
            showMessage("❌ Pages must be at least 1", true);
            pagesInput.value = 1;
            return;
        }

        const payload = {
            employee: employee,
            document: documentName,
            pages: pages
        };

        fetch("/add-fifo", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(async response => {
            if (!response.ok) {
                const errText = await response.text().catch(() => "");
                throw new Error(`Server error: ${response.status}`);
            }
            return response.json().catch(() => ({}));
        })
        .then(() => {
            showMessage(`📄 Job added for ${employee} - "${documentName}" (${pages} p.)`, false);
            empInput.value = "";
            docInput.value = "";
            pagesInput.value = "1";
            empInput.focus();
            loadJobs(); // immediate refresh
        })
        .catch(error => {
            console.error("Add job error:", error);
            showMessage(`⚠️ Failed to add job: ${error.message}`, true);
        });
    }

    // Event listeners
    addButton.addEventListener("click", addJob);
    // allow Enter key on any input field to add
    const inputs = [empInput, docInput, pagesInput];
    inputs.forEach(inp => {
        inp.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                addJob();
            }
        });
    });

    // periodic polling (every 2s)
    let intervalId = setInterval(loadJobs, 2000);
    loadJobs();

    // graceful page unload cleanup (optional)
    window.addEventListener("beforeunload", () => {
        if (intervalId) clearInterval(intervalId);
    });
</script>
</body>
</html>
